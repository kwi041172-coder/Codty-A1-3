<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy English Buddy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">🌟 Easy English</div>
        <ul class="nav-links">
            <li><a href="#home">홈</a></li>
            <li><a href="#ai-buddy">AI 대화</a></li>
            <li><a href="#tips">학습팁</a></li>
        </ul>
        <button id="theme-toggle">테마 변경</button>
    </nav>

    <section id="home" class="section">
        <h1>나만의 AI 영어 친구</h1>
        <p>어려운 영어 공부는 그만! 상황만 말씀하시면 AI가 바로 알려드려요.</p>
    </section>

    <section id="ai-buddy" class="section">
        <h2>AI 선생님에게 물어보기</h2>
        <form id="chat-form" class="chat-container">
            <label for="user-input">영어로 말하고 싶은 상황</label>
            <div class="input-row">
                <input type="text" id="user-input" placeholder="예: 카페에서 커피 주문할 때" maxlength="500" required>
                <button type="submit" id="ask-button">질문하기</button>
            </div>
            <div id="loading" class="hidden" role="status" aria-live="polite">AI 선생님이 문장을 만들고 있어요... ☕</div>
            <div id="result-display" class="result-box" role="status" aria-live="polite">궁금한 상황을 입력하고 버튼을 눌러보세요!</div>
        </form>
    </section>

    <section id="tips" class="section">
        <h2>초보자를 위한 학습 팁</h2>
        <div class="tips-grid">
            <div class="tip-card">🗣️ 크게 따라 읽기</div>
            <div class="tip-card">📅 매일 5분씩만</div>
            <div class="tip-card">🍎 쉬운 단어부터</div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
